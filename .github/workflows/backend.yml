name: Backend CI

on:
  push:
    branches: [main, develop]
    paths:
      - "backend/**"
      - ".github/workflows/backend.yml"
  pull_request:
    branches: [main]
    paths:
      - "backend/**"

jobs:
  lint-and-test:
    name: Lint & Test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: britarh
          POSTGRES_PASSWORD: britarh_secret
          POSTGRES_DB: britarh_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Configurar Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Instalar dependências
        working-directory: backend
        run: pip install -e ".[dev]"

      - name: Lint com ruff
        working-directory: backend
        run: ruff check .

      - name: Type check com mypy
        working-directory: backend
        run: mypy app/

      - name: Rodar testes
        working-directory: backend
        run: pytest
        env:
          DATABASE_URL: "postgresql+asyncpg://britarh:britarh_secret@localhost:5432/britarh_db"
